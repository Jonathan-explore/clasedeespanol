# Evita que Supabase (plan Free) pause el proyecto por inactividad (~7 días).
# Hace una lectura mínima cada 3 días. Solo usa la clave PÚBLICA (publishable)
# que ya está en script.js: no necesita secretos.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'   # cada 3 días, 06:17 UTC
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta ligera a Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 10 \
            "https://akontludfisgxwlnayvs.supabase.co/rest/v1/config_clase?select=key&limit=1" \
            -H "apikey: sb_publishable_qQ2lCD9UTN77IGsvNi6X5g_LXBeLTkq"
          echo
          echo "Supabase responde"
