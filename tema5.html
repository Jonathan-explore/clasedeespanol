<!-- ============================================================
     CONTENIDO DEL TEMA 5 · LOS VERBOS EN -ER
     Mismo formato que el Tema 4. La idea entera del tema cabe en
     una frase: cambia la A por una E. La forma yo ni se toca.
     ============================================================ -->
<script>
window.TEMA = {

num: 5,
es:  'Los verbos <em>en -ER</em>',
da:  'ER-udsagnsord — cambia la A por una E',
intro: 'I <b>Tema 4</b> lærte du <b>-ar</b>-verberne: <b>-o</b>, <b>-as</b>, <b>-a</b>. Nu kommer den anden store gruppe, <b>-er</b>-verberne — og her er den gode nyhed: <b>du kan allerede det halve</b>. <i>yo</i>-formen er præcis den samme, og i de to andre bytter du bare <b>A</b> ud med <b>E</b>. Seks nye udsagnsord, én lille ændring.',
hoja: 'Hoja_del_alumno_Tema5_Verbos_ER.pdf',

/* Los verbos en -er usan estas tres terminaciones. */
finales: ['o','es','e'],

bloques: [

  /* ── A · LA REGLA ─────────────────────────────────────── */
  { letra:'A', es:'Cambia la A por una E', da:'Byt A ud med E',
    nota:'Pon las dos familias una al lado de la otra. Hay <b>una sola</b> diferencia, y la primera línea ni siquiera cambia.',
    html:
      '<div class="tabla-scroll">'+
      '<table class="mini-tabla" style="min-width:420px">'+
        '<tr><th>Quién · hvem</th><th>-AR · hablar</th><th>-ER · comer</th><th></th></tr>'+
        '<tr><td>yo · jeg</td><td>habl<b style="color:var(--glow)">o</b></td>'+
            '<td style="color:var(--text)">com<b style="color:var(--glow)">o</b></td>'+
            '<td style="color:#4ade80;font-size:.8rem">samme!</td></tr>'+
        '<tr><td>tú · du</td><td>habl<b style="color:var(--glow)">as</b></td>'+
            '<td style="color:var(--text)">com<b style="color:var(--glow)">es</b></td>'+
            '<td style="color:var(--text-dim);font-size:.8rem">a → e</td></tr>'+
        '<tr><td>él / ella · han / hun</td><td>habl<b style="color:var(--glow)">a</b></td>'+
            '<td style="color:var(--text)">com<b style="color:var(--glow)">e</b></td>'+
            '<td style="color:var(--text-dim);font-size:.8rem">a → e</td></tr>'+
      '</table></div>'+

      '<p style="text-align:center;font-size:1.25rem;margin:1.4rem 0 .4rem;letter-spacing:.02em">'+
        '<code>com</code> <span style="opacity:.5">+</span> '+
        '<b style="color:var(--glow)">es</b> <span style="opacity:.5">=</span> '+
        '<b style="font-size:1.35rem">comes</b></p>'+
      '<p style="text-align:center;font-size:.85rem;color:var(--text-dim);margin-bottom:1.2rem">'+
        'stammen · <code>com</code> — endelsen · <code>-es</code></p>'+

      '<ul>'+
        '<li>Samme fremgangsmåde som i Tema 4: tag infinitiv — <code>com<b>er</b></code>, '+
          '<code>beb<b>er</b></code>, <code>corr<b>er</b></code> — og fjern <b>-er</b>.</li>'+
        '<li>Det, der er tilbage, er <b>stammen</b>. Den ændrer sig aldrig.</li>'+
        '<li>Sæt en af de tre nye endelser på: <b>-o</b>, <b>-es</b>, <b>-e</b>.</li>'+
      '</ul>'+

      '<div class="ojo">⚠️ <b>¡OJO!</b> Det vigtigste i hele temaet: <b>kig altid på infinitiv først</b>.<br>'+
      'Ender det på <code>-ar</code>? → <b>-o, -as, -a</b><br>'+
      'Ender det på <code>-er</code>? → <b>-o, -es, -e</b><br>'+

  /* ── B · LOS SEIS VERBOS ──────────────────────────────── */

            '<td>com<b>o</b></td><td>com<b>es</b></td><td style="color:var(--text)">com<b>e</b></td></tr>'+

            '<td>beb<b>o</b></td><td>beb<b>es</b></td><td style="color:var(--text)">beb<b>e</b></td></tr>'+
        '<tr><td>leer<br><span style="font-size:.78rem;opacity:.6">at læse</span></td>'+
            '<td>le<b>o</b></td><td>le<b>es</b></td><td style="color:var(--text)">le<b>e</b></td></tr>'+
        '<tr><td>aprender<br><span style="font-size:.78rem;opacity:.6">at lære</span></td>'+
            '<td>aprend<b>o</b></td><td>aprend<b>es</b></td><td style="color:var(--text)">aprend<b>e</b></td></tr>'+
        '<tr><td>correr<br><span style="font-size:.78rem;opacity:.6">at løbe</span></td>'+
            '<td>corr<b>o</b></td><td>corr<b>es</b></td><td style="color:var(--text)">corr<b>e</b></td></tr>'+
        '<tr><td style="color:#fbbf24 !important">querer 🔥<br><span style="font-size:.78rem;opacity:.6">at ville have</span></td>'+
            '<td>qu<b style="color:#fbbf24">ie</b>r<b>o</b></td><td>qu<b style="color:#fbbf24">ie</b>r<b>es</b></td>'+
            '<td style="color:var(--text)">qu<b style="color:#fbbf24">ie</b>r<b>e</b></td></tr>'+
      '</table></div>'+
      '<div class="ojo">🔥 <b>querer er oprøreren</b>, ligesom <i>jugar</i> i Tema 4. Stammen laver om på sig selv: '+

      'Og det er et af de mest nyttige ord, du lærer i år: <code>Quiero una pizza.</code></div>' },

  { letra:'D', es:'Para acabar la frase', da:'Ord til at bygge sætningen færdig',

      ['un libro','en bog'],
      ['el móvil','mobilen'],
      ['español / inglés','spansk / engelsk'],

  /* ── E · FRASES DE EJEMPLO ────────────────────────────── */
  { letra:'E', es:'Dieciocho frases de verdad', da:'Atten rigtige sætninger',

    frases:[
      ['Yo como pizza.','Jeg spiser pizza.'],

      ['Yo bebo agua.','Jeg drikker vand.'],
      ['Tú bebes zumo.','Du drikker juice.'],
      ['Él bebe leche.','Han drikker mælk.'],

      ['Yo leo un libro.','Jeg læser en bog.'],
      ['Tú lees en español.','Du læser på spansk.'],

      ['Yo aprendo español.','Jeg lærer spansk.'],

      ['Yo corro los martes.','Jeg løber om tirsdagen.'],

      ['Yo quiero una pizza.','Jeg vil have en pizza.'],
      ['Tú quieres un bocadillo.','Du vil have en sandwich.'],
      ['Él quiere agua.','Han vil have vand.']
    ] },

  { letra:'F', es:'¿Y tú?', da:'Spørg din sidemakker',
    nota:'Til at spørge bruger du <b>-es</b>-formen. Læg mærke til <code>¿Qué quieres?</code> — den kommer du til at bruge resten af livet.',
    frases:[
      ['¿Qué comes?','Hvad spiser du?'],
      ['Como un bocadillo.','Jeg spiser en sandwich.'],
      ['¿Qué bebes?','Hvad drikker du?'],

      ['¿Qué quieres?','Hvad vil du have?'],
      ['Quiero una pizza, por favor.','Jeg vil gerne have en pizza, tak.']
    ] },

  /* ── G · TRES AVISOS ──────────────────────────────────── */
  { letra:'G', es:'Tres cosas que hay que recordar', da:'Tre ting du skal huske',
    html:
      '<ul>'+
        '<li><b>1 · Infinitiv først.</b> Før du bøjer noget som helst, kig på de sidste to bogstaver: '+
          '<code>-ar</code> eller <code>-er</code>? Det afgør hele resten.</li>'+
        '<li><b>2 · yo-formen er gratis.</b> Den er <code>-o</code> i begge grupper. '+
          '<code>hablo</code>, <code>como</code>, <code>bailo</code>, <code>bebo</code>. Den kan du allerede.</li>'+
        '<li><b>3 · Alt det andet virker som før.</b> Nægtelse: <code>no</code> foran '+
          '(<code>No como carne.</code>). Spørgsmål: to tegn (<code>¿Bebes agua?</code>). '+
          'Pronomenet er stadig usynligt.</li>'+
      '</ul>'+
      '<div class="ojo">⚠️ <b>¡OJO!</b> Den typiske fejl i dette tema er at blande de to familier: '+
      '<s>tú comas</s> ❌ → <b>tú comes</b> ✅ &nbsp;·&nbsp; <s>ella hable</s> ❌ → <b>ella habla</b> ✅<br>'+
      'Reglen i én sætning: <b>A-verber beholder deres A, E-verber deres E.</b></div>' }

],

  es:'Ocho frases sobre mí',

  lineas:[
