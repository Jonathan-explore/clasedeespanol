<!-- ============================================================
     CONTENIDO DEL TEMA 5 · LOS VERBOS EN -ER
     Versión corta y visual. La idea entera cabe en una frase:
     cambia la A por una E. Nada de gramática en profundidad —
     están aquí para hablar y pasarlo bien, no para saberlo todo.
     Si hace falta recortar más, se quitan frases de D y E.
     ============================================================ -->
<script>
window.TEMA = {

num: 5,
es:  'Los verbos <em>en -ER</em>',
da:  'ER-udsagnsord — byt A ud med E',
intro: 'Du kan allerede <b>-ar</b>-verberne. Her er hele Tema 5: <b>byt A ud med E</b>. Og <i>yo</i>-formen ændrer sig slet ikke. Det var det.',
hoja: 'Hoja_del_alumno_Tema5_Verbos_ER.pdf',

/* Los verbos en -er usan estas tres terminaciones. */
finales: ['o','es','e'],

bloques: [

  /* ── A · LA REGLA, EN UNA TABLA ───────────────────────── */
  { letra:'A', es:'Cambia la A por una E', da:'Byt A ud med E',
    nota:'De to familier ved siden af hinanden. Første linje er <b>helt ens</b>.',
    html:
      '<div class="fam">'+
        '<div class="fam-row">'+
          '<div class="fam-cab">-AR<b>hablar</b></div>'+
          '<div class="fam-cab"></div>'+
          '<div class="fam-cab">-ER<b>comer</b></div>'+
        '</div>'+
        '<div class="fam-row">'+
          '<div class="fam-word"><span>habl<b>o</b></span></div>'+
          '<div class="fam-quien">yo<small>jeg</small></div>'+
          '<div class="fam-word"><span>com<b>o</b></span><span class="fam-tag ok">samme!</span></div>'+
        '</div>'+
        '<div class="fam-row">'+
          '<div class="fam-word"><span>habl<b>as</b></span></div>'+
          '<div class="fam-quien">tú<small>du</small></div>'+
          '<div class="fam-word"><span>com<b>es</b></span><span class="fam-tag">a → e</span></div>'+
        '</div>'+
        '<div class="fam-row">'+
          '<div class="fam-word"><span>habl<b>a</b></span></div>'+
          '<div class="fam-quien">él / ella<small>han / hun</small></div>'+
          '<div class="fam-word"><span>com<b>e</b></span><span class="fam-tag">a → e</span></div>'+
        '</div>'+
      '</div>'+

      '<p style="text-align:center;font-size:1.25rem;margin:1.4rem 0 .3rem;letter-spacing:.02em">'+
        '<code>com</code> <span style="opacity:.5">+</span> '+
        '<b style="color:var(--glow)">es</b> <span style="opacity:.5">=</span> '+
        '<b style="font-size:1.35rem">comes</b></p>'+
      '<p style="text-align:center;font-size:.85rem;color:var(--text-dim);margin-bottom:.6rem">'+
        'com<s>er</s> → <code>com</code> + <b>-o</b>, <b>-es</b>, <b>-e</b></p>' },

  /* ── B · LOS SEIS VERBOS ──────────────────────────────── */
  { letra:'B', es:'Los seis verbos', da:'Ugens seks udsagnsord',
    nota:'Tryk på 🔊 for at høre dem.',
    frases:[
      ['comer','at spise'],
      ['beber','at drikke'],
      ['leer','at læse'],
      ['aprender','at lære'],
      ['correr','at løbe'],
      ['querer','at ville have']
    ] },

  /* ── C · LA TABLA ─────────────────────────────────────── */
  { letra:'C', es:'Todo en una tabla', da:'Det hele på ét bord',
    nota:'Tag et billede af den med mobilen.',
    html:
      '<div class="tabla-scroll">'+
      '<table class="mini-tabla" style="min-width:440px">'+
        '<tr><th>Infinitivo</th><th>yo <span style="color:var(--glow)">-o</span></th>'+
            '<th>tú <span style="color:var(--glow)">-es</span></th>'+
            '<th>él/ella <span style="color:var(--glow)">-e</span></th></tr>'+
        '<tr><td>comer<br><span style="font-size:.78rem;opacity:.6">at spise</span></td>'+
            '<td>com<b>o</b></td><td>com<b>es</b></td><td style="color:var(--text)">com<b>e</b></td></tr>'+
        '<tr><td>beber<br><span style="font-size:.78rem;opacity:.6">at drikke</span></td>'+
            '<td>beb<b>o</b></td><td>beb<b>es</b></td><td style="color:var(--text)">beb<b>e</b></td></tr>'+
        '<tr><td>leer<br><span style="font-size:.78rem;opacity:.6">at læse</span></td>'+
            '<td>le<b>o</b></td><td>le<b>es</b></td><td style="color:var(--text)">le<b>e</b></td></tr>'+
        '<tr><td>aprender<br><span style="font-size:.78rem;opacity:.6">at lære</span></td>'+
            '<td>aprend<b>o</b></td><td>aprend<b>es</b></td><td style="color:var(--text)">aprend<b>e</b></td></tr>'+
        '<tr><td>correr<br><span style="font-size:.78rem;opacity:.6">at løbe</span></td>'+
            '<td>corr<b>o</b></td><td>corr<b>es</b></td><td style="color:var(--text)">corr<b>e</b></td></tr>'+
        '<tr><td style="color:#fbbf24 !important">querer 🔥<br><span style="font-size:.78rem;opacity:.6">at ville have</span></td>'+
            '<td>qu<b style="color:#fbbf24">ie</b>r<b>o</b></td><td>qu<b style="color:#fbbf24">ie</b>r<b>es</b></td>'+
            '<td style="color:var(--text)">qu<b style="color:#fbbf24">ie</b>r<b>e</b></td></tr>'+
      '</table></div>'+
      '<div class="ojo">🔥 <b>querer</b> er oprøreren: man siger <b>quiero</b>, ikke <s>quero</s>. '+
      'Endelserne er de samme. Og det er årets mest nyttige ord: <code>Quiero una pizza.</code></div>' },

  /* ── D · FRASES ───────────────────────────────────────── */
  { letra:'D', es:'Frases para usar hoy', da:'Sætninger du kan bruge i dag',
    nota:'Læs dem højt. Kig på det <b>sidste bogstav</b>.',
    frases:[
      ['Yo como pizza.','Jeg spiser pizza.'],
      ['Tú bebes zumo.','Du drikker juice.'],
      ['Ella lee el móvil.','Hun læser på mobilen.'],
      ['Yo aprendo español.','Jeg lærer spansk.'],
      ['Él corre en el parque.','Han løber i parken.'],
      ['Yo quiero una pizza.','Jeg vil have en pizza.']
    ] },

  /* ── E · PREGUNTAR ────────────────────────────────────── */
  { letra:'E', es:'¿Y tú?', da:'Spørg din sidemakker',
    nota:'Til spørgsmål bruger du <b>-es</b>-formen.',
    frases:[
      ['¿Qué comes?','Hvad spiser du?'],
      ['¿Qué bebes?','Hvad drikker du?'],
      ['¿Corres los martes?','Løber du om tirsdagen?'],
      ['¿Qué quieres?','Hvad vil du have?'],
      ['Quiero una pizza, por favor.','Jeg vil gerne have en pizza, tak.']
    ] }

],

/* ── MI TARJETA ──────────────────────────────────────────── */
tarjeta: {
  es:'Cuatro frases sobre mí',
  da:'Fire sætninger om mig',
  nota:'Udfyld hullerne og læs det højt for din sidemakker.',
  lineas:[
    ['Yo com',      'o + pizza, pasta…',              '.'],
    ['Yo beb',      'o + agua, zumo…',                '.'],
    ['Yo quier',    'o + una pizza…',                 '.'],
    ['Mi amigo/a ', 'come, bebe, lee… husk -e!',      ' también.']
  ]
},

/* ── CHECKLIST ───────────────────────────────────────────── */
checklist: [
  ['Me sé las tres terminaciones: -o, -es, -e.','Jeg kan de tre endelser: -o, -es, -e.'],
  ['La forma yo es igual en -ar y en -er.','yo-formen er ens i -ar og -er.'],
  ['Puedo pedir algo con quiero.','Jeg kan bede om noget med quiero.']
],

/* ── Verbos para el ejercicio de terminaciones ───────────── */
conjuga: [
  {inf:'comer',    raiz:'com',    da:'at spise',      pres:'spiser'},
  {inf:'beber',    raiz:'beb',    da:'at drikke',     pres:'drikker'},
  {inf:'leer',     raiz:'le',     da:'at læse',       pres:'læser'},
  {inf:'aprender', raiz:'aprend', da:'at lære',       pres:'lærer'},
  {inf:'correr',   raiz:'corr',   da:'at løbe',       pres:'løber'},
  {inf:'querer',   raiz:'quier',  da:'at ville have', pres:'vil have'}
],

/* ── Formas conjugadas para escucha, puzle y LinguaStrike ── */
vocab: [
  {es:'como',      da:'jeg spiser'},
  {es:'comes',     da:'du spiser'},
  {es:'come',      da:'han/hun spiser'},
  {es:'bebo',      da:'jeg drikker'},
  {es:'bebes',     da:'du drikker'},
  {es:'bebe',      da:'han/hun drikker'},
  {es:'leo',       da:'jeg læser'},
  {es:'lees',      da:'du læser'},
  {es:'lee',       da:'han/hun læser'},
  {es:'aprendo',   da:'jeg lærer'},
  {es:'aprendes',  da:'du lærer'},
  {es:'aprende',   da:'han/hun lærer'},
  {es:'corro',     da:'jeg løber'},
  {es:'corres',    da:'du løber'},
  {es:'corre',     da:'han/hun løber'},
  {es:'quiero',    da:'jeg vil have'},
  {es:'quieres',   da:'du vil have'},
  {es:'quiere',    da:'han/hun vil have'}
],

/* ── Frases para el ejercicio de parejas ─────────────────── */
frases: [
  {es:'Yo como pizza.',        da:'Jeg spiser pizza.'},
  {es:'Tú comes en el instituto.', da:'Du spiser i skolen.'},
  {es:'Ella come fruta.',      da:'Hun spiser frugt.'},
  {es:'Yo bebo agua.',         da:'Jeg drikker vand.'},
  {es:'Él bebe leche.',        da:'Han drikker mælk.'},
  {es:'Yo leo un libro.',      da:'Jeg læser en bog.'},
  {es:'Tú lees en español.',   da:'Du læser på spansk.'},
  {es:'Yo aprendo español.',   da:'Jeg lærer spansk.'},
  {es:'Ella corre todos los días.', da:'Hun løber hver dag.'},
  {es:'Yo quiero una pizza.',  da:'Jeg vil have en pizza.'},
  {es:'No como carne.',        da:'Jeg spiser ikke kød.'},
  {es:'¿Qué quieres?',         da:'Hvad vil du have?'},
  {es:'¿Bebes agua?',          da:'Drikker du vand?'},
  {es:'¿Aprendes español?',    da:'Lærer du spansk?'}
]

};
</script>
