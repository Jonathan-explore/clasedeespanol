<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo en español</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&family=DM+Sans:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="tema.css" />
<style>
/* ── BINGO ─────────────────────────────────────────────────
   Página suelta y autocontenida. Los colores salen de las
   variables de style.css, así que funciona en claro y oscuro. */
/* El hueco de abajo deja sitio al boton flotante del diccionario,
   que si no tapa la ultima casilla del carton en el movil. */
.bingo-wrap{max-width:1000px;margin:0 auto;padding:1.4rem 1.1rem 7.5rem}
.bingo-h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,2.6rem);
  font-weight:700;color:var(--text-strong);line-height:1.15}
.bingo-h1 em{font-style:italic;background:linear-gradient(90deg,var(--glow),var(--glow2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bingo-sub{color:var(--text-dim);font-size:.95rem;margin:.3rem 0 1.6rem}

/* Elegir quién eres */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-bottom:2rem}
.rol{padding:1.6rem 1.4rem;border-radius:var(--r);cursor:pointer;text-align:left;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);
  font-family:inherit;transition:all .25s ease}
.rol:hover{transform:translateY(-3px);border-color:var(--glass-border-hover)}
.rol b{display:block;font-size:1.15rem;color:var(--text-strong);margin:.5rem 0 .25rem}
.rol span{font-size:.85rem;color:var(--text-dim);line-height:1.5}
.rol .rol-ico{font-size:1.9rem;line-height:1}

/* Elegir el grupo de palabras */
.pools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.4rem}
.pool{padding:.55rem 1rem;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.88rem;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:all .2s ease}
.pool:hover{border-color:var(--glass-border-hover)}
.pool.on{background:rgba(94,234,212,.14);border-color:var(--glow);color:var(--glow);font-weight:600}
[data-theme="light"] .pool.on{background:rgba(42,117,96,.12)}

/* ── Pantalla de quien canta ── */
.canta{border-radius:var(--r-lg);border:1px solid var(--glass-border);background:var(--glass);
  padding:2rem 1.4rem;text-align:center;margin-bottom:1.2rem;position:relative;overflow:hidden}
.canta::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(94,234,212,.12),transparent 65%);pointer-events:none}
[data-theme="light"] .canta::before{background:radial-gradient(circle at 50% 0%,rgba(42,117,96,.09),transparent 65%)}
.canta-da{font-size:clamp(2.4rem,10vw,5.2rem);font-weight:700;color:var(--text-strong);
  line-height:1.05;word-break:break-word;letter-spacing:-.02em;
  animation:sale .38s cubic-bezier(.2,1.5,.4,1) both}
@keyframes sale{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
.canta-es{font-size:clamp(1.05rem,3vw,1.6rem);color:var(--glow);margin-top:.6rem;font-weight:600}
.canta-vacio{font-size:1rem;color:var(--text-dim);padding:1.6rem 0}
.canta-tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.barra{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.4rem}
.btn-grande{flex:1;min-width:200px;padding:1.15rem 1.4rem;border-radius:18px;cursor:pointer;
  font-family:inherit;font-size:1.15rem;font-weight:700;border:none;color:#04201a;
  background:linear-gradient(135deg,var(--glow),var(--glow2));
  box-shadow:0 6px 20px rgba(94,234,212,.22);transition:transform .15s ease,box-shadow .2s ease}
.btn-grande:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(94,234,212,.3)}
.btn-grande:active{transform:translateY(0)}
.btn-grande:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.btn-sec{padding:.7rem 1.1rem;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.88rem;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:all .2s ease}
.btn-sec:hover{border-color:var(--glass-border-hover)}
.contador{font-size:.9rem;font-weight:700;color:var(--glow);white-space:nowrap;
  padding:.45rem .85rem;border-radius:12px;background:rgba(94,234,212,.12)}
[data-theme="light"] .contador{background:rgba(42,117,96,.1)}

/* Rejilla de todas las palabras */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.45rem}
.pal{padding:.55rem .7rem;border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:all .15s ease}
.pal b{display:block;font-size:.92rem;color:var(--text-strong)}
.pal span{display:block;font-size:.76rem;color:var(--text-dim)}
.pal.dicha{opacity:.42}
.pal.dicha b{text-decoration:line-through}
.pal.ultima{border-color:var(--glow);background:rgba(94,234,212,.14);opacity:1}

/* ── Cartón ───────────────────────────────────────────────
   4x4 = 16 casillas, como un cartón de bingo de verdad. */
.carton-caja{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--glass-border);
  background:var(--glass);margin-bottom:.2rem}
.carton-tira{display:flex;align-items:center;justify-content:center;gap:clamp(.6rem,4vw,2rem);
  padding:.55rem;background:linear-gradient(135deg,var(--glow),var(--glow2));color:#04201a}
.carton-tira span{font-family:'Playfair Display',serif;font-weight:700;
  font-size:clamp(1rem,4.5vw,1.5rem);line-height:1}
.carton-cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  flex-wrap:wrap;padding:.7rem .9rem}
.carton-num{font-family:'Share Tech Mono',monospace;font-size:1.5rem;color:var(--glow);font-weight:700}
.carton{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;padding:0 .55rem .7rem}
.casilla{min-height:4.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:.3rem .15rem;border-radius:12px;cursor:pointer;font-family:inherit;
  line-height:1.15;font-size:clamp(.6rem,2.5vw,.85rem);font-weight:600;position:relative;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text-strong);
  transition:transform .12s ease,border-color .2s ease;word-break:break-word;hyphens:auto}
.casilla .art{font-size:.65em;font-weight:700;opacity:.5;text-transform:uppercase;letter-spacing:.06em}
.casilla:active{transform:scale(.94)}
/* La marca imita el tampón del bingo */
.casilla.marcada{border-color:var(--glow);color:var(--glow)}
.casilla.marcada::before{content:'';position:absolute;inset:0;border-radius:12px;
  background:radial-gradient(circle at 50% 50%,rgba(94,234,212,.42) 0 58%,rgba(94,234,212,.14) 60%);
  animation:tampon .25s ease-out both}
[data-theme="light"] .casilla.marcada::before{
  background:radial-gradient(circle at 50% 50%,rgba(42,117,96,.3) 0 58%,rgba(42,117,96,.1) 60%)}
@keyframes tampon{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.casilla.marcada .art,.casilla.marcada span:not(.art){position:relative}
.casilla.linea{border-color:var(--ok-line);color:var(--ok)}
.casilla.linea::before{background:radial-gradient(circle at 50% 50%,rgba(34,197,94,.45) 0 58%,rgba(34,197,94,.16) 60%)}

.aviso{margin-top:1.1rem;padding:1.3rem 1.2rem;border-radius:18px;text-align:center;
  font-size:1.6rem;font-weight:800;letter-spacing:.02em;border:2px solid var(--ok-line);
  background:rgba(34,197,94,.14);color:var(--ok);animation:sale .4s cubic-bezier(.2,1.5,.4,1) both}
.aviso small{display:block;font-size:.82rem;font-weight:400;margin-top:.45rem;opacity:.9;letter-spacing:0}

/* Comprobar un cartón desde la pantalla de quien canta */
.comprobar{margin-top:2rem;padding-top:1.6rem;border-top:1px solid var(--glass-border)}
.comprobar-fila{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.comprobar input{width:120px;padding:.6rem .9rem;border-radius:12px;font-family:inherit;font-size:1rem;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text-strong)}
.comprobar input:focus{outline:none;border-color:var(--glow)}
.mini-carton{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;max-width:420px}
.mini-casilla{padding:.5rem .25rem;border-radius:9px;text-align:center;font-size:.7rem;font-weight:600;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);word-break:break-word}
.mini-casilla.dicha{background:rgba(34,197,94,.16);border-color:var(--ok-line);color:var(--ok)}
.veredicto{margin-top:.9rem;font-size:1rem;font-weight:600}

/* Dirección para los alumnos */
.enlace-caja{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-top:2rem;
  padding:1.2rem;border-radius:var(--r);background:var(--glass);border:1px solid var(--glass-border)}
.enlace-caja img{width:132px;height:132px;border-radius:10px;flex:0 0 auto;background:#fff;padding:5px}
.enlace-txt{flex:1;min-width:210px}
.enlace-txt b{display:block;font-size:.92rem;color:var(--text-strong);margin-bottom:.35rem}
.enlace-url{font-family:'Share Tech Mono',monospace;font-size:.95rem;color:var(--glow);word-break:break-all}
.enlace-txt small{display:block;font-size:.8rem;color:var(--text-dim);margin-top:.5rem;line-height:1.5}

/* En tema claro el degradado es verde oscuro: el texto casi negro
   se quedaba en 3:1. Sobre ese fondo va en blanco. */
[data-theme="light"] .btn-grande,
[data-theme="light"] .carton-tira{color:#fff}

/* Boton esperando el segundo toque para confirmar. */
.btn-sec.armado{background:rgba(251,146,60,.16);border-color:#fb923c;color:#b45309;font-weight:700}
[data-theme="light"] .btn-sec.armado{color:#9a3412}

.oculto{display:none !important}
@media print{ .bingo-wrap{padding:0} .barra,.comprobar,.enlace-caja,.back-btn{display:none !important} }
</style>
</head>

      <button id="qd-close" class="modal-close" aria-label="Luk modal">✕</button>
      <div class="modal-icon">📖</div>
      <h2 class="modal-title" style="font-size:1.5rem">Hurtig Ordbog</h2>
      <div class="input-wrap" style="margin-top:1.5rem">
        <input type="text" id="qd-input" class="admin-input" placeholder="Søg efter ord..." />
        <div class="input-glow"></div>
      </div>
      <div id="qd-result" class="qd-result">
        <span style="color:var(--text-dim);font-size:0.9rem">Skriv et ord for at se oversættelsen</span>
      </div>
    </div>
  </div>

/* Las diez líneas de un cartón 4x4: 4 filas, 4 columnas, 2 diagonales. */
var LINEAS = (function(){
  var L = [], i, j, fila, col, d1 = [], d2 = [];
  for(i = 0; i < LADO; i++){
    fila = []; col = [];
    for(j = 0; j < LADO; j++){ fila.push(i * LADO + j); col.push(j * LADO + i); }
    L.push(fila); L.push(col);
    d1.push(i * LADO + i);
    d2.push(i * LADO + (LADO - 1 - i));
  }
  L.push(d1); L.push(d2);
  return L;
})();

function vacias(){
  var a = [], i;
  for(i = 0; i < CASILLAS; i++) a.push(false);
  return a;
}

/* ── utilidades ─────────────────────────────────────────── */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Separa "el perro" en artículo y palabra, para que la casilla
   quepa mejor y se siga viendo el género. */
function parte(es){
  var m = /^(el|la|un|una)\s+(.+)$/i.exec(es);
  return m ? { art:m[1], resto:m[2] } : { art:'', resto:es };
}
/* Generador con semilla (mulberry32): el mismo cartón da siempre
   exactamente las mismas palabras. */
function rng(semilla){
  var a = semilla >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function indicePool(id){
  for(var i=0;i<POOLS.length;i++){ if(POOLS[i].id===id) return i; }
  return 0;
}
function pool(id){ return POOLS[indicePool(id)]; }
function poolPorLetra(l){
  for(var i=0;i<POOLS.length;i++){ if(POOLS[i].letra===l) return POOLS[i]; }
  return null;
}
/* Las palabras del cartón. Determinista: la semilla mezcla el
   número y el grupo, así el A47 no es el mismo que el C47. */
function cartonDe(poolId, num){
  var p = pool(poolId), r = rng(num * 977 + indicePool(poolId) * 7919 + 13);
  var copia = p.palabras.slice();
  for(var i=copia.length-1;i>0;i--){
    var j = Math.floor(r() * (i+1));
    var t = copia[i]; copia[i] = copia[j]; copia[j] = t;
  }
  return copia.slice(0, CASILLAS);
}
/* "A47", "a 47", "47" → {p, num}. Estricto a propósito: si se
   cuela un "47x" es mejor pedir que lo repita que dar por bueno
   un cartón que el alumno no tiene. */
function leeId(txt, poolPorDefecto){
  var m = /^\s*([A-Da-d])?\s*0*(\d{1,3})\s*$/.exec(txt || '');
  if(!m) return null;
  var num = parseInt(m[2], 10);
  if(!(num >= 1 && num <= 999)) return null;
  var p = m[1] ? poolPorLetra(m[1].toUpperCase()) : pool(poolPorDefecto);
  return p ? { p:p, num:num, conLetra: !!m[1] } : null;
}
function leer(k, porDefecto){
  try{ var v = localStorage.getItem(k); return v===null ? porDefecto : JSON.parse(v); }
  catch(e){ return porDefecto; }
}
function guardar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ── El estado de las partidas vive AQUÍ, no dentro de la
   función que dibuja. Por eso cambiar de grupo o recargar ya
   no se lleva por delante lo que llevabas. Cada grupo guarda
   lo suyo por separado. ─────────────────────────────────── */
function partidaProfe(poolId){
  var g = leer('bingo.profe.' + poolId, null);
  if(!g || !(g.dichas instanceof Array)) g = { dichas:[], enEspanol:false };
  /* Se guarda la PALABRA, no su posicion en la lista. Antes se
     guardaba el indice, y bastaba anadir una palabra al grupo para
     que la partida guardada senalara a otras distintas. De paso se
     tiran las que ya no existan en el grupo. */
  var p = pool(poolId);
  g.dichas = g.dichas.filter(function(t){
    if(typeof t !== 'string') return false;
    for(var i=0;i<p.palabras.length;i++){ if(p.palabras[i][0] === t) return true; }
    return false;
  });
  return g;
}
/* Busca la pareja [es, da] de una palabra dentro de un grupo. */
function buscaPalabra(p, texto){
  for(var i=0;i<p.palabras.length;i++){ if(p.palabras[i][0] === texto) return p.palabras[i]; }
  return null;
}
function guardaProfe(poolId, g){ guardar('bingo.profe.' + poolId, g); }

/* Un solo cartón activo por grupo: así no se acumulan claves
   viejas en el navegador cada vez que se pide cartón nuevo. */
function cartonAlumno(poolId){
  var c = leer('bingo.carton.' + poolId, null);
  /* Se comprueba tambien la VERSION: si cambian las palabras de un
     grupo, el mismo numero da otro carton y las marcas guardadas
     apuntarian a casillas equivocadas. Mejor empezar de cero. */
  if(!c || c.v !== VERSION || !(c.num >= 1 && c.num <= 999) ||
     !(c.marcadas instanceof Array) || c.marcadas.length !== CASILLAS){
    c = { v: VERSION, num: 1 + Math.floor(Math.random() * 999), marcadas: vacias() };
    guardar('bingo.carton.' + poolId, c);
  }
  return c;
}
function guardaCarton(poolId, c){ guardar('bingo.carton.' + poolId, c); }

/* Confirmar sin el dialogo del navegador: los navegadores incrustados
   -el de la app, o abrir el enlace desde Instagram o Snapchat- no lo
   muestran, devuelven false, y el boton se quedaba sin hacer nada.
   Aqui el primer toque arma el boton y el segundo ejecuta. */
function conGuardia(btn, hayQuePerder, textoAviso, accion){
  if(!btn) return;
  if(!hayQuePerder){ btn.addEventListener('click', accion); return; }
  var original = btn.innerHTML, armado = false, reloj = null;
  function desarma(){
    armado = false; btn.innerHTML = original; btn.classList.remove('armado');
  }
  btn.addEventListener('click', function(){
    if(armado){ clearTimeout(reloj); accion(); return; }
    armado = true;
    btn.innerHTML = textoAviso;
    btn.classList.add('armado');
    reloj = setTimeout(desarma, 4000);
  });
}

/* ── selector de grupo de palabras (común a las dos pantallas) ── */
function pintaPools(actual){
  return '<div class="pools">'+ POOLS.map(function(p){
    return '<button class="pool'+(p.id===actual?' on':'')+'" type="button" data-pool="'+p.id+'">'+
      '<b style="opacity:.55;font-weight:700">'+p.letra+'</b> '+
      esc(p.nom)+' <span style="opacity:.6">· '+esc(p.de)+'</span></button>';
  }).join('') +'</div>';
}
function enganchaPools(alCambiar){
  raiz.querySelectorAll('[data-pool]').forEach(function(b){
    b.addEventListener('click', function(){ alCambiar(b.dataset.pool); });
  });
}
/* La tira de colores con B-I-N-G-O, para que parezca lo que es. */
function tiraBingo(){
  return '<div class="carton-tira">'+ 'BINGO'.split('').map(function(l){
    return '<span>'+l+'</span>';
  }).join('') +'</div>';
}

/* ════════════════════════════════════════════════════════════
   1 · INICIO
   ════════════════════════════════════════════════════════════ */
function vistaInicio(){
  raiz.innerHTML =
    '<h1 class="bingo-h1">Bingo <em>en español</em></h1>'+
    '<p class="bingo-sub">Læreren læser ordet højt. Du finder det på dit kort.</p>'+
    '<div class="roles">'+
      '<button class="rol" type="button" id="soy-profe">'+
        '<span class="rol-ico">🎤</span>'+
        '<b>Jeg råber ordene op</b>'+
        '<span>Til læreren. Træk et ord, læs det højt, og hold styr på hvad der er sagt.</span>'+
      '</button>'+
      '<button class="rol" type="button" id="soy-alumno">'+
        '<span class="rol-ico">🎟️</span>'+
        '<b>Jeg har et kort</b>'+
        '<span>Til dig. Du får dit eget kort med 16 ord — tryk på dem, du hører.</span>'+
      '</button>'+
    '</div>'+
    '<p style="font-size:.85rem;color:var(--text-dim);line-height:1.6">'+
      'Husk reglen: for at vinde skal du <b>læse din række højt på spansk</b>. '+
      'Kan du ikke det, fortsætter spillet.</p>';

  document.getElementById('soy-profe').addEventListener('click', function(){ vistaProfe('t3'); });
  document.getElementById('soy-alumno').addEventListener('click', function(){ vistaAlumno('t3'); });
}

/* ════════════════════════════════════════════════════════════
   2 · LA QUE CANTA
   ════════════════════════════════════════════════════════════ */
function vistaProfe(poolId){
  var p = pool(poolId);
  var g = partidaProfe(poolId);          // {dichas, enEspanol} — ya guardado
  var consulta = { txt:'', html:'' };    // lo tecleado en "comprobar", para no perderlo al repintar

  function pinta(){
    var ultima = g.dichas.length ? buscaPalabra(p, g.dichas[g.dichas.length-1]) : null;
    var grande = ultima ? (g.enEspanol ? ultima[0] : ultima[1]) : '';
    var chica  = ultima ? (g.enEspanol ? ultima[1] : ultima[0]) : '';
    var agotado = g.dichas.length >= p.palabras.length;

    raiz.innerHTML =
      '<h1 class="bingo-h1">Bingo <em>en español</em></h1>'+
      '<p class="bingo-sub">Træk et ord og læs det højt. Eleverne leder på deres kort.</p>'+
      pintaPools(poolId)+

      '<div class="canta">'+
        (ultima
          ? '<p class="canta-tag">'+(g.enEspanol?'du siger · español':'du siger · dansk')+'</p>'+
            '<p class="canta-da">'+esc(grande)+'</p>'+
            '<p class="canta-es">'+(g.enEspanol?'betyder: ':'på deres kort: ')+esc(chica)+'</p>'
          : '<p class="canta-vacio">Tryk på <b>Træk et ord</b> for at begynde.</p>')+
        (agotado
          ? '<p style="margin-top:.9rem;font-size:.9rem;color:var(--text-dim);position:relative">'+
            '🏁 Alle '+p.palabras.length+' ord er sagt. Tryk <b>Nyt spil</b> for at begynde forfra.</p>'
          : '')+
      '</div>'+

      '<div class="barra">'+
        '<button class="btn-grande" type="button" id="sacar"'+(agotado?' disabled':'')+'>🎲 Træk et ord</button>'+
        '<button class="btn-sec" type="button" id="idioma">'+
          (g.enEspanol?'🔁 Skift til dansk':'🔁 Skift til spansk')+'</button>'+
        '<button class="btn-sec" type="button" id="reinicio">🔄 Nyt spil</button>'+
        '<span class="contador">'+g.dichas.length+' / '+p.palabras.length+'</span>'+
      '</div>'+

      '<div class="lista">'+ p.palabras.map(function(w,i){
        var ya = g.dichas.indexOf(w[0]) >= 0;
        var ult = g.dichas.length && g.dichas[g.dichas.length-1]===w[0];
        return '<button class="pal'+(ya?' dicha':'')+(ult?' ultima':'')+'" type="button" '+
          'aria-pressed="'+(ya?'true':'false')+'" data-i="'+i+'">'+
          '<b>'+esc(w[0])+'</b><span>'+esc(w[1])+'</span></button>';
      }).join('') +'</div>'+

      '<div class="comprobar">'+
        '<p style="font-size:.92rem;color:var(--text-strong);font-weight:600;margin-bottom:.2rem">'+
          '¿Bingo de verdad? · Er det rigtigt?</p>'+
        '<p style="font-size:.84rem;color:var(--text-dim);margin-bottom:.9rem">'+
          'Spørg om kortets kode — den står øverst på elevens kort, fx <b>'+p.letra+'47</b> — '+
          'og skriv den her. Bogstavet siger hvilken gruppe kortet er fra.</p>'+
        '<div class="comprobar-fila">'+
          '<input type="text" id="num-carton" placeholder="'+p.letra+'47" '+
            'inputmode="text" autocomplete="off" spellcheck="false" maxlength="5" />'+
          '<button class="btn-sec" type="button" id="ver-carton">Se kortet</button>'+
        '</div>'+
        '<div id="salida-carton"></div>'+
      '</div>'+

      '<div class="enlace-caja">'+
        (URL_AQUI === URL_PUBLICADA
          ? '<img src="'+QR+'" alt="QR" />'
          : '')+
        '<div class="enlace-txt">'+
          '<b>📱 Elevernes kort</b>'+
          '<div class="enlace-url">'+esc(URL_AQUI.replace(/^https?:\/\//,''))+
            ' <span style="opacity:.45">'+VERSION+'</span></div>'+

          (URL_AQUI === URL_PUBLICADA
            ? '<small>Scan koden eller skriv adressen. Tryk derefter på <b>Jeg har et kort</b> '+
              'og vælg gruppe <b>'+p.letra+' · '+esc(p.nom)+'</b> — samme som her.</small>'
            : '<small>⚠️ Ikke den offentlige adresse — QR skjult.</small>')+
        '</div>'+
      '</div>';

    /* Devolver lo que había en el recuadro de comprobar: repintamos
       toda la vista en cada clic y si no se perdería el número. */
    var inpNum = document.getElementById('num-carton');
    var out    = document.getElementById('salida-carton');
    inpNum.value = consulta.txt;
    if(consulta.html) out.innerHTML = consulta.html;

    enganchaPools(function(id){ vistaProfe(id); });

    document.getElementById('sacar').addEventListener('click', function(){
      var libres = p.palabras.filter(function(w){ return g.dichas.indexOf(w[0]) < 0; });
      if(!libres.length) return;
      g.dichas.push(libres[Math.floor(Math.random()*libres.length)][0]);
      guardaProfe(poolId, g); pinta();
    });
    document.getElementById('idioma').addEventListener('click', function(){
      g.enEspanol = !g.enEspanol; guardaProfe(poolId, g); pinta();
    });
    conGuardia(document.getElementById('reinicio'), g.dichas.length > 0,
      '⚠️ Sikker? Tryk igen', function(){
        g.dichas = []; consulta = { txt:'', html:'' };
        guardaProfe(poolId, g); pinta();
      });
    /* Tocar una palabra la marca o la desmarca, por si se canta a mano
       o se cuela una sin querer. */
    raiz.querySelectorAll('[data-i]').forEach(function(b){
      b.addEventListener('click', function(){
        var t = p.palabras[+b.dataset.i][0], k = g.dichas.indexOf(t);
        if(k >= 0) g.dichas.splice(k,1); else g.dichas.push(t);
        guardaProfe(poolId, g); pinta();
      });
    });

    function comprueba(){
      consulta.txt = inpNum.value;
      var id = leeId(inpNum.value, poolId);
      if(!id){
        consulta.html = '<p class="veredicto" style="color:var(--bad)">'+
          'Skriv kortets kode, fx <b>'+p.letra+'47</b> (bogstav + tal fra 1 til 999).</p>';
        out.innerHTML = consulta.html;
        return;
      }
      /* Se comprueba SIEMPRE contra el grupo del cartón, no contra el
         que esté elegido en pantalla: si el alumno está en otro grupo
         el veredicto seguiría siendo correcto. */
      var otroGrupo = id.p.id !== poolId;
      var gOtro = otroGrupo ? partidaProfe(id.p.id) : g;
      var cart = cartonDe(id.p.id, id.num);
      var hechas = cart.map(function(w){ return gOtro.dichas.indexOf(w[0]) >= 0; });
      var lineas = LINEAS.filter(function(l){
        return l.every(function(i){ return hechas[i]; });
      }).length;
      var lleno = hechas.every(function(x){ return x; });

      consulta.html =
        '<p style="font-size:.85rem;color:var(--text-dim);margin-bottom:.5rem">'+
          'Kort <b style="color:var(--glow)">'+id.p.letra+id.num+'</b> · '+esc(id.p.nom)+
          (id.conLetra ? '' : ' <i>(uden bogstav — antog den valgte gruppe)</i>')+
          (otroGrupo ? ' <b style="color:#fbbf24">⚠️ en anden gruppe end din skærm</b>' : '')+
        '</p>'+
        '<div class="mini-carton">'+ cart.map(function(w,i){
          return '<div class="mini-casilla'+(hechas[i]?' dicha':'')+'">'+esc(w[0])+'</div>';
        }).join('') +'</div>'+
        '<p class="veredicto" style="color:'+((lineas||lleno)?'var(--ok)':'var(--bad)')+'">'+
          (lleno ? '🎉 BINGO! Hele kortet er sagt.'
                 : lineas ? '✅ LÍNEA! ' + (lineas > 1 ? lineas + ' rækker er rigtige.' : 'Rækken er rigtig.')
                 : '❌ Ikke endnu — der mangler ord.')+
        '</p>'+
        '<p style="font-size:.8rem;color:var(--text-dim);margin-top:.4rem">'+
          'Grønt = ord du har sagt. Bed eleven læse rækken højt på spansk.</p>';
      out.innerHTML = consulta.html;
    }
    document.getElementById('ver-carton').addEventListener('click', comprueba);
    inpNum.addEventListener('input', function(){ consulta.txt = inpNum.value; });
    inpNum.addEventListener('keydown', function(e){ if(e.key==='Enter') comprueba(); });
  }
  pinta();
}

/* ════════════════════════════════════════════════════════════
   3 · EL CARTÓN DEL ALUMNO
   ════════════════════════════════════════════════════════════ */
function vistaAlumno(poolId){
  var p = pool(poolId);
  var c = cartonAlumno(poolId);          // {num, marcadas} — ya guardado
  var cart = cartonDe(poolId, c.num);
  var codigo = p.letra + c.num;

  function pinta(){
    var enLinea = {}, lineas = 0;
    LINEAS.forEach(function(l){
      if(l.every(function(i){ return c.marcadas[i]; })){
        lineas++;
        l.forEach(function(i){ enLinea[i] = true; });
      }
    });
    var lleno = c.marcadas.every(function(x){ return x; });

    raiz.innerHTML =
      '<h1 class="bingo-h1">Mit <em>bingokort</em></h1>'+
      '<p class="bingo-sub">Tryk på ordet, når du hører det. Vælg den samme gruppe som på tavlen.</p>'+
      pintaPools(poolId)+

      '<div class="carton-caja">'+
        tiraBingo()+
        '<div class="carton-cab">'+
          '<div><span style="font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)">'+
            esc(p.nom)+'</span><br><span class="carton-num">'+codigo+'</span>'+
          '<span style="font-size:.7rem;color:var(--text-dim);margin-left:.45rem">'+VERSION+'</span></div>'+
          '<button class="btn-sec" type="button" id="otro">🔄 Nyt kort</button>'+
        '</div>'+
        '<div class="carton">'+ cart.map(function(w,i){
          var cls = c.marcadas[i] ? (enLinea[i] ? 'marcada linea' : 'marcada') : '';
          var t = parte(w[0]);
          return '<button class="casilla '+cls+'" type="button" '+
            'aria-pressed="'+(c.marcadas[i]?'true':'false')+'" data-c="'+i+'">'+
            (t.art ? '<span class="art">'+esc(t.art)+'</span>' : '')+
            '<span>'+esc(t.resto)+'</span></button>';
        }).join('') +'</div>'+
      '</div>'+

      (lleno
        ? '<div class="aviso">🎉 ¡BINGO!<small>Råb det — og læs hele kortet højt på spansk. Dit kort er '+codigo+'.</small></div>'
        : lineas
          ? '<div class="aviso">✅ ¡LÍNEA!'+(lineas>1?' ×'+lineas:'')+
            '<small>Råb det — og læs din række højt på spansk. Dit kort er '+codigo+'.</small></div>'
          : '<p style="font-size:.84rem;color:var(--text-dim);margin-top:1.1rem;line-height:1.6">'+
            'Fire i træk — vandret, lodret eller skråt — er <b>¡Línea!</b> Alle 16 er <b>¡Bingo!</b><br>'+
            'Sig din kode (<b>'+codigo+'</b>), hvis læreren skal tjekke kortet.</p>');

    enganchaPools(function(id){ vistaAlumno(id); });

    raiz.querySelectorAll('[data-c]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = +b.dataset.c;
        c.marcadas[i] = !c.marcadas[i];
        guardaCarton(poolId, c); pinta();
      });
    });
    var puestas = c.marcadas.filter(function(x){ return x; }).length;
    conGuardia(document.getElementById('otro'), puestas > 0,
      '⚠️ Sikker? Tryk igen', function(){
        c = { v: VERSION, num: 1 + Math.floor(Math.random() * 999), marcadas: vacias() };
        guardaCarton(poolId, c);
        cart = cartonDe(poolId, c.num);
        codigo = p.letra + c.num;
        pinta();
      });
  }
  pinta();
}

vistaInicio();

})();
</script>

</html>
