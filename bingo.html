<style>
/* ── BINGO ─────────────────────────────────────────────────
   Página suelta y autocontenida. Los colores salen de las
   variables de style.css, así que funciona en claro y oscuro. */
/* El hueco de abajo deja sitio al boton flotante del diccionario,
   que si no tapa la ultima casilla del carton en el movil. */
.bingo-wrap{max-width:1000px;margin:0 auto;padding:1.4rem 1.1rem 7.5rem}
.bingo-h1{font-family:'Playfair Display',serif;font-size:clamp(1.8rem,5vw,2.6rem);
  font-weight:700;color:var(--text-strong);line-height:1.15}
.bingo-h1 em{font-style:italic;background:linear-gradient(90deg,var(--glow),var(--glow2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.bingo-sub{color:var(--text-dim);font-size:.95rem;margin:.3rem 0 1.6rem}

/* Elegir quién eres */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-bottom:2rem}
.rol{padding:1.6rem 1.4rem;border-radius:var(--r);cursor:pointer;text-align:left;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);
  font-family:inherit;transition:all .25s ease}
.rol:hover{transform:translateY(-3px);border-color:var(--glass-border-hover)}
.rol b{display:block;font-size:1.15rem;color:var(--text-strong);margin:.5rem 0 .25rem}
.rol span{font-size:.85rem;color:var(--text-dim);line-height:1.5}
.rol .rol-ico{font-size:1.9rem;line-height:1}

/* Elegir el grupo de palabras */
.pools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.4rem}
.pool{padding:.55rem 1rem;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.88rem;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:all .2s ease}
.pool:hover{border-color:var(--glass-border-hover)}
.pool.on{background:rgba(94,234,212,.14);border-color:var(--glow);color:var(--glow);font-weight:600}
[data-theme="light"] .pool.on{background:rgba(42,117,96,.12)}

/* ── Pantalla de quien canta ── */
.canta{border-radius:var(--r-lg);border:1px solid var(--glass-border);background:var(--glass);
  padding:1.8rem 1.4rem;text-align:center;margin-bottom:1.2rem}
.canta-da{font-size:clamp(2.2rem,9vw,4.6rem);font-weight:700;color:var(--text-strong);
  line-height:1.1;word-break:break-word}
.canta-es{font-size:clamp(1rem,3vw,1.5rem);color:var(--glow);margin-top:.5rem;font-weight:600}
.canta-vacio{font-size:1rem;color:var(--text-dim);padding:1.4rem 0}
.canta-tag{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.barra{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1.4rem}
.btn-grande{flex:1;min-width:200px;padding:1.1rem 1.4rem;border-radius:18px;cursor:pointer;
  font-family:inherit;font-size:1.1rem;font-weight:600;border:none;color:#04201a;
  background:linear-gradient(135deg,var(--glow),var(--glow2));transition:transform .2s ease}
.btn-grande:hover{transform:translateY(-2px)}
.btn-grande:disabled{opacity:.4;cursor:default;transform:none}
.btn-sec{padding:.7rem 1.1rem;border-radius:14px;cursor:pointer;font-family:inherit;font-size:.88rem;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:all .2s ease}
.btn-sec:hover{border-color:var(--glass-border-hover)}
.contador{font-size:.85rem;color:var(--text-dim);white-space:nowrap}

/* Rejilla de todas las palabras */
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.45rem}
.pal{padding:.55rem .7rem;border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);transition:all .15s ease}
.pal b{display:block;font-size:.92rem;color:var(--text-strong)}
.pal span{display:block;font-size:.76rem;color:var(--text-dim)}
.pal.dicha{opacity:.42}
.pal.dicha b{text-decoration:line-through}
.pal.ultima{border-color:var(--glow);background:rgba(94,234,212,.14);opacity:1}

/* ── Cartón ── */
.carton-cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;
  flex-wrap:wrap;margin-bottom:.9rem}
.carton-num{font-family:'Share Tech Mono',monospace;font-size:1.5rem;color:var(--glow);font-weight:700}
.carton{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.casilla{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:.4rem;border-radius:16px;cursor:pointer;font-family:inherit;line-height:1.2;
  font-size:clamp(.72rem,2.6vw,1rem);font-weight:600;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text-strong);
  transition:all .15s ease;word-break:break-word;hyphens:auto}
.casilla:hover{border-color:var(--glass-border-hover)}
.casilla.marcada{background:rgba(94,234,212,.20);border-color:var(--glow);color:var(--glow)}
[data-theme="light"] .casilla.marcada{background:rgba(42,117,96,.16)}
.casilla.linea{background:rgba(34,197,94,.22);border-color:var(--ok-line);color:var(--ok)}
.aviso{margin-top:1.1rem;padding:1rem 1.2rem;border-radius:16px;text-align:center;
  font-size:1.15rem;font-weight:700;border:1px solid var(--ok-line);
  background:rgba(34,197,94,.12);color:var(--ok)}
.aviso small{display:block;font-size:.8rem;font-weight:400;margin-top:.3rem;opacity:.85}

/* Comprobar un cartón desde la pantalla de quien canta */
.comprobar{margin-top:2rem;padding-top:1.6rem;border-top:1px solid var(--glass-border)}
.comprobar-fila{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.comprobar input{width:120px;padding:.6rem .9rem;border-radius:12px;font-family:inherit;font-size:1rem;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text-strong)}
.comprobar input:focus{outline:none;border-color:var(--glow)}
.mini-carton{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;max-width:330px}
.mini-casilla{padding:.6rem .3rem;border-radius:10px;text-align:center;font-size:.78rem;font-weight:600;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim)}
.mini-casilla.dicha{background:rgba(34,197,94,.16);border-color:var(--ok-line);color:var(--ok)}
.veredicto{margin-top:.9rem;font-size:1rem;font-weight:600}

/* Dirección para los alumnos */
.enlace-caja{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-top:2rem;
  padding:1.2rem;border-radius:var(--r);background:var(--glass);border:1px solid var(--glass-border)}
.enlace-caja img{width:132px;height:132px;border-radius:10px;flex:0 0 auto;background:#fff;padding:5px}
.enlace-txt{flex:1;min-width:210px}
.enlace-txt b{display:block;font-size:.92rem;color:var(--text-strong);margin-bottom:.35rem}
.enlace-url{font-family:'Share Tech Mono',monospace;font-size:.95rem;color:var(--glow);word-break:break-all}
.enlace-txt small{display:block;font-size:.8rem;color:var(--text-dim);margin-top:.5rem;line-height:1.5}

.oculto{display:none !important}
@media print{ .bingo-wrap{padding:0} .barra,.comprobar,.enlace-caja,.back-btn{display:none !important} }
</style>

      ['canto','jeg synger'],    ['cantas','du synger'],    ['canta','han/hun synger'],
      ['juego','jeg spiller'],   ['juegas','du spiller'],   ['juega','han/hun spiller']
    ] },

  { id:'t5', nom:'Verbos en -ER', da:'ER-udsagnsord', de:'Tema 5',
    palabras:[
      ['como','jeg spiser'],      ['comes','du spiser'],      ['come','han/hun spiser'],
      ['bebo','jeg drikker'],     ['bebes','du drikker'],     ['bebe','han/hun drikker'],
      ['leo','jeg læser'],        ['lees','du læser'],        ['lee','han/hun læser'],
      ['aprendo','jeg lærer'],    ['aprendes','du lærer'],    ['aprende','han/hun lærer'],
      ['corro','jeg løber'],      ['corres','du løber'],      ['corre','han/hun løber'],
      ['quiero','jeg vil have'],  ['quieres','du vil have'],  ['quiere','han/hun vil have']
    ] },

  /* El más difícil: mezcla -ar y -er, así que hay que mirar el
     infinitivo antes de decidir la terminación. */
  { id:'mix', nom:'Verbos mezclados', da:'Blandede udsagnsord', de:'Temas 4 y 5',
    palabras:[
      ['hablo','jeg taler'],      ['hablas','du taler'],      ['habla','han/hun taler'],
      ['bailo','jeg danser'],     ['bailas','du danser'],     ['baila','han/hun danser'],
      ['canto','jeg synger'],     ['juegas','du spiller'],    ['escucha','han/hun lytter'],
      ['como','jeg spiser'],      ['comes','du spiser'],      ['come','han/hun spiser'],
      ['bebo','jeg drikker'],     ['bebes','du drikker'],     ['bebe','han/hun drikker'],
      ['leo','jeg læser'],        ['aprendes','du lærer'],    ['corre','han/hun løber'],
      ['quiero','jeg vil have'],  ['quieres','du vil have']
    ] }
];

var LINEAS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

/* ── utilidades ─────────────────────────────────────────── */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* Generador con semilla (mulberry32): el mismo número de cartón
   da siempre exactamente las mismas nueve palabras. */
function rng(semilla){
  var a = semilla >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pool(id){
  for(var i=0;i<POOLS.length;i++){ if(POOLS[i].id===id) return POOLS[i]; }
  return POOLS[0];
}
function indicePool(id){
  for(var i=0;i<POOLS.length;i++){ if(POOLS[i].id===id) return i; }
  return 0;
}
/* Las nueve palabras del cartón N. Determinista: la semilla mezcla
   el número y el grupo, así el cartón 47 de los verbos no es el
   cartón 47 de los animales. */
function cartonDe(poolId, num){
  var p = pool(poolId), r = rng(num * 977 + indicePool(poolId) * 7919 + 13);
  var copia = p.palabras.slice();
  for(var i=copia.length-1;i>0;i--){
    var j = Math.floor(r() * (i+1));
    var t = copia[i]; copia[i] = copia[j]; copia[j] = t;
  }
  return copia.slice(0,9);
}
function leer(k, porDefecto){
  try{ var v = localStorage.getItem(k); return v===null ? porDefecto : JSON.parse(v); }
  catch(e){ return porDefecto; }
}
function guardar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var raiz = document.getElementById('bingo-root');

/* ── selector de grupo de palabras (común a las dos pantallas) ── */
function pintaPools(actual){
  return '<div class="pools">'+ POOLS.map(function(p){
    return '<button class="pool'+(p.id===actual?' on':'')+'" type="button" data-pool="'+p.id+'">'+
      esc(p.nom)+' <span style="opacity:.6">· '+esc(p.de)+'</span></button>';
  }).join('') +'</div>';
}
function enganchaPools(alCambiar){
  raiz.querySelectorAll('[data-pool]').forEach(function(b){
    b.addEventListener('click', function(){ alCambiar(b.dataset.pool); });
  });
}

/* ════════════════════════════════════════════════════════════
   1 · INICIO
   ════════════════════════════════════════════════════════════ */
function vistaInicio(){
  raiz.innerHTML =
    '<h1 class="bingo-h1">Bingo <em>en español</em></h1>'+
    '<p class="bingo-sub">Læreren siger ordet højt. Du finder det på dit kort.</p>'+
    '<div class="roles">'+
      '<button class="rol" type="button" id="soy-profe">'+
        '<span class="rol-ico">🎤</span>'+
        '<b>Jeg synger bingo</b>'+
        '<span>Til læreren. Tag et ord, læs det højt, og hold styr på hvad der er sagt.</span>'+
      '</button>'+
      '<button class="rol" type="button" id="soy-alumno">'+
        '<span class="rol-ico">🎟️</span>'+
        '<b>Jeg har et kort</b>'+
        '<span>Til dig. Du får dit eget kort med ni ord — tryk på dem, du hører.</span>'+
      '</button>'+
    '</div>'+
    '<p style="font-size:.85rem;color:var(--text-dim);line-height:1.6">'+
      'Husk reglen: for at vinde skal du <b>læse din række højt på spansk</b>. '+
      'Kan du ikke det, fortsætter spillet.</p>';

  document.getElementById('soy-profe').addEventListener('click', function(){ vistaProfe('t3'); });
  document.getElementById('soy-alumno').addEventListener('click', function(){ vistaAlumno('t3'); });
}

/* ════════════════════════════════════════════════════════════
   2 · LA QUE CANTA
   ════════════════════════════════════════════════════════════ */
function vistaProfe(poolId){
  var p = pool(poolId);
  var dichas = [];        // índices ya cantados, en orden
  var enEspanol = false;  // false = canta en danés (más difícil para ellos)

  function pinta(){
    var ultima = dichas.length ? p.palabras[dichas[dichas.length-1]] : null;
    var grande = ultima ? (enEspanol ? ultima[0] : ultima[1]) : '';
    var chica  = ultima ? (enEspanol ? ultima[1] : ultima[0]) : '';

    raiz.innerHTML =
      '<h1 class="bingo-h1">Bingo <em>en español</em></h1>'+
      '<p class="bingo-sub">Tryk på knappen, og læs ordet højt. Eleverne leder på deres kort.</p>'+
      pintaPools(poolId)+

      '<div class="canta">'+
        (ultima
          ? '<p class="canta-tag">'+(enEspanol?'siger du · español':'siger du · dansk')+'</p>'+
            '<p class="canta-da">'+esc(grande)+'</p>'+
            '<p class="canta-es">'+(enEspanol?'betyder: ':'på deres kort: ')+esc(chica)+'</p>'
          : '<p class="canta-vacio">Tryk på <b>Tag et ord</b> for at begynde.</p>')+
      '</div>'+

      '<div class="barra">'+
        '<button class="btn-grande" type="button" id="sacar"'+
          (dichas.length>=p.palabras.length?' disabled':'')+'>🎲 Tag et ord</button>'+
        '<button class="btn-sec" type="button" id="idioma">'+
          (enEspanol?'🔁 Skift til dansk':'🔁 Skift til spansk')+'</button>'+
        '<button class="btn-sec" type="button" id="reinicio">🔄 Nyt spil</button>'+
        '<span class="contador">'+dichas.length+' / '+p.palabras.length+'</span>'+
      '</div>'+

      '<div class="lista">'+ p.palabras.map(function(w,i){
        var ya = dichas.indexOf(i) >= 0;
        var ult = dichas.length && dichas[dichas.length-1]===i;
        return '<button class="pal'+(ya?' dicha':'')+(ult?' ultima':'')+'" type="button" data-i="'+i+'">'+
          '<b>'+esc(w[0])+'</b><span>'+esc(w[1])+'</span></button>';
      }).join('') +'</div>'+

      '<div class="comprobar">'+
        '<p style="font-size:.92rem;color:var(--text-strong);font-weight:600;margin-bottom:.2rem">'+
          '¿Bingo de verdad? · Er det rigtigt?</p>'+
        '<p style="font-size:.84rem;color:var(--text-dim);margin-bottom:.9rem">'+
          'Spørg om kortets nummer og skriv det her. Så ser du præcis det kort.</p>'+
        '<div class="comprobar-fila">'+
          '<input type="number" id="num-carton" placeholder="nr." min="1" max="999" />'+
          '<button class="btn-sec" type="button" id="ver-carton">Se kortet</button>'+
        '</div>'+
        '<div id="salida-carton"></div>'+
      '</div>'+

      '<div class="enlace-caja">'+
        '<img src="'+QR+'" alt="QR" />'+
        '<div class="enlace-txt">'+
          '<b>📱 Elevernes kort</b>'+
          '<div class="enlace-url">'+esc(URL_ALUMNO.replace(/^https:\/\//,''))+'</div>'+
          '<small>Scan koden eller skriv adressen. Tryk derefter på <b>Jeg har et kort</b> '+
          'og vælg <b>'+esc(p.nom)+'</b> — samme gruppe som her.</small>'+
        '</div>'+
      '</div>';

    enganchaPools(function(id){ vistaProfe(id); });

    document.getElementById('sacar').addEventListener('click', function(){
      var libres = [];
      for(var i=0;i<p.palabras.length;i++){ if(dichas.indexOf(i)<0) libres.push(i); }
      if(!libres.length) return;
      dichas.push(libres[Math.floor(Math.random()*libres.length)]);
      pinta();
    });
    document.getElementById('idioma').addEventListener('click', function(){
      enEspanol = !enEspanol; pinta();
    });
    document.getElementById('reinicio').addEventListener('click', function(){
      dichas = []; pinta();
    });
    /* Tocar una palabra la marca o la desmarca, por si se canta a mano
       o se cuela una sin querer. */
    raiz.querySelectorAll('[data-i]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = +b.dataset.i, k = dichas.indexOf(i);
        if(k >= 0) dichas.splice(k,1); else dichas.push(i);
        pinta();
      });
    });

    var btnVer = document.getElementById('ver-carton');
    var inpNum = document.getElementById('num-carton');
    function comprueba(){
      var n = parseInt(inpNum.value, 10);
      var out = document.getElementById('salida-carton');
      if(!(n >= 1 && n <= 999)){
        out.innerHTML = '<p class="veredicto" style="color:var(--bad)">Skriv et nummer mellem 1 og 999.</p>';
        return;
      }
      var cart = cartonDe(poolId, n);
      var hechas = cart.map(function(w){
        for(var i=0;i<p.palabras.length;i++){
          if(p.palabras[i][0] === w[0]) return dichas.indexOf(i) >= 0;
        }
        return false;
      });
      var tieneLinea = LINEAS.some(function(l){ return hechas[l[0]] && hechas[l[1]] && hechas[l[2]]; });
      var lleno = hechas.every(function(x){ return x; });

      out.innerHTML =
        '<div class="mini-carton">'+ cart.map(function(w,i){
          return '<div class="mini-casilla'+(hechas[i]?' dicha':'')+'">'+esc(w[0])+'</div>';
        }).join('') +'</div>'+
        '<p class="veredicto" style="color:'+((tieneLinea||lleno)?'var(--ok)':'var(--bad)')+'">'+
          (lleno ? '🎉 BINGO! Hele kortet er sagt.'
                 : tieneLinea ? '✅ LÍNEA! Rækken er rigtig.'
                 : '❌ Ikke endnu — der mangler ord.')+
        '</p>'+
        '<p style="font-size:.8rem;color:var(--text-dim);margin-top:.4rem">'+
          'Grønt = ord du har sagt. Bed eleven læse rækken højt på spansk.</p>';
    }
    btnVer.addEventListener('click', comprueba);
    inpNum.addEventListener('keydown', function(e){ if(e.key==='Enter') comprueba(); });
  }
  pinta();
}

/* ════════════════════════════════════════════════════════════
   3 · EL CARTÓN DEL ALUMNO
   ════════════════════════════════════════════════════════════ */
function vistaAlumno(poolId){
  var p = pool(poolId);
  var claveNum = 'bingo.num.' + poolId;
  var num = leer(claveNum, null);
  if(!(num >= 1 && num <= 999)){
    num = 1 + Math.floor(Math.random() * 999);
    guardar(claveNum, num);
  }
  var claveMarcas = 'bingo.marcas.' + poolId + '.' + num;
  var marcadas = leer(claveMarcas, []);
  if(!(marcadas instanceof Array) || marcadas.length !== 9) marcadas = [false,false,false,false,false,false,false,false,false];
  var cart = cartonDe(poolId, num);

  function pinta(){
    var enLinea = {};
    var lineas = 0;
    LINEAS.forEach(function(l){
      if(marcadas[l[0]] && marcadas[l[1]] && marcadas[l[2]]){
        lineas++; enLinea[l[0]] = enLinea[l[1]] = enLinea[l[2]] = true;
      }
    });
    var lleno = marcadas.every(function(x){ return x; });

    raiz.innerHTML =
      '<h1 class="bingo-h1">Mit <em>bingokort</em></h1>'+
      '<p class="bingo-sub">Tryk på ordet, når du hører det. Vælg den samme gruppe som på tavlen.</p>'+
      pintaPools(poolId)+

      '<div class="carton-cab">'+
        '<div><span style="font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)">'+
          esc(p.nom)+'</span><br><span class="carton-num">CARTÓN '+num+'</span></div>'+
        '<button class="btn-sec" type="button" id="otro">🔄 Nyt kort</button>'+
      '</div>'+

      '<div class="carton">'+ cart.map(function(w,i){
        var cls = marcadas[i] ? (enLinea[i] ? 'marcada linea' : 'marcada') : '';
        return '<button class="casilla '+cls+'" type="button" data-c="'+i+'">'+esc(w[0])+'</button>';
      }).join('') +'</div>'+

      (lleno
        ? '<div class="aviso">🎉 ¡BINGO!<small>Råb det — og læs hele kortet højt på spansk.</small></div>'
        : lineas
          ? '<div class="aviso">✅ ¡LÍNEA!<small>Råb det — og læs din række højt på spansk.</small></div>'
          : '<p style="font-size:.84rem;color:var(--text-dim);margin-top:1.1rem;line-height:1.6">'+
            'Tre i træk — vandret, lodret eller skråt — er <b>¡Línea!</b> Alle ni er <b>¡Bingo!</b><br>'+
            'Sig dit nummer ('+num+'), hvis læreren skal tjekke kortet.</p>');

    enganchaPools(function(id){ vistaAlumno(id); });

    raiz.querySelectorAll('[data-c]').forEach(function(b){
      b.addEventListener('click', function(){
        var i = +b.dataset.c;
        marcadas[i] = !marcadas[i];
        guardar(claveMarcas, marcadas);
        pinta();
      });
    });
    document.getElementById('otro').addEventListener('click', function(){
      num = 1 + Math.floor(Math.random() * 999);
      guardar(claveNum, num);
      claveMarcas = 'bingo.marcas.' + poolId + '.' + num;
      marcadas = [false,false,false,false,false,false,false,false,false];
      guardar(claveMarcas, marcadas);
      cart = cartonDe(poolId, num);
      pinta();
    });
  }
  pinta();
}

vistaInicio();

})();
</script>
